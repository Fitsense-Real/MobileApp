# Verificacion minima de cada PR del Mobile: analisis, pruebas y compilacion.
# Sin secretos ni despliegue: no publica APK ni toca el backend.
name: CI

on:
  pull_request:
  push:
    branches: [generation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # The toolchain this branch was validated with; fail fast on any other.
      - name: Versiones (Flutter 3.50.1 / Dart 3.14.0)
        run: |
          flutter --version
          dart --version
          flutter --version | grep -q '^Flutter 3\.50\.1 ' || { echo 'Se esperaba Flutter 3.50.1'; exit 1; }
          dart --version 2>&1 | grep -q 'Dart SDK version: 3\.14\.0 ' || { echo 'Se esperaba Dart 3.14.0'; exit 1; }

      - name: Dependencias
        run: flutter pub get

      # Warnings and errors stay fatal. The info-level notices are still printed:
      # they are the deprecation of package:flutter/material.dart in favour of
      # material_ui, pending a separate migration because fl_chart and
      # go_router still use the old types (MIGRACION_FLUTTER_3_50.md).
      - name: Analisis
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Compilacion web
        run: flutter build web --release

      - name: Compilacion Android (APK debug)
        run: flutter build apk --debug
