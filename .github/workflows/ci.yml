# Verificacion minima de cada PR del Mobile: analisis, pruebas y compilacion.
# Sin secretos ni despliegue: no publica APK ni toca el backend.
name: CI

on:
  pull_request:
  push:
    branches: [generation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Analisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilacion web
        run: flutter build web --release

      - name: Compilacion Android (APK debug)
        run: flutter build apk --debug
