# 8 GB of heap plus 4 GB of metaspace crashed the Gradle daemon on machines
# that also run the emulator and Android Studio. 4 GB is plenty for this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9 defaults, declared explicitly: when these keys are missing the Flutter
# 3.50 migrator writes both as false. Verified with the current plugins
# (docs/preparacion_google_play/ACTUALIZACION_COMPONENTES_OBSOLETOS.md).
android.newDsl=true
android.builtInKotlin=true
# Jetifier removed: :app:checkJetifier reports no legacy support libraries.
