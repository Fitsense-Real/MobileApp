# 8 GB of heap plus 4 GB of metaspace crashed the Gradle daemon on machines
# that also run the emulator and Android Studio. 4 GB is plenty for this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Transitional (Flutter 3.50.1 migrator and app template): the Flutter plugins
# in pubspec.lock still use the classic Android DSL and need kotlin-android
# applied for them. Remove both flags once every plugin supports AGP 9's new
# DSL and built-in Kotlin (docs/preparacion_google_play/MIGRACION_FLUTTER_3_50.md).
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
