# 8 GB of heap plus 4 GB of metaspace crashed the Gradle daemon on machines
# that also run the emulator and Android Studio. 4 GB is plenty for this app.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
